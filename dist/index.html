<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROP-IDE</title>

    <script>
        var LOCAL_VERSION = "6.3.0"
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512x512.png">
    <link rel="manifest" href="./assets/manifest-CksoMjeB.json">
    <meta name="theme-color" content="#528bff">

    <link rel="stylesheet" href="./vendor/pyscript/dist/core.css" />
    <script type="module" src="./vendor/pyscript/dist/core.js"></script>

    <style>
        /* ====== 基础布局 ====== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #21252b;
            font-size: 14px;
        }

        .toolbar {
            padding: 10px;
            background: #3a3f4b;
            border-bottom: 1px solid #4a4f5a;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ccc;
        }
        .toolbar button {
            padding: 5px 10px;
            background-color: #528bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .toolbar button:hover { background-color: #699eff; }
        .toolbar input[type="text"] {
            width: 60px;
            background: #282c34;
            color: #ccc;
            border: 1px solid #4a4f5a;
            border-radius: 4px;
            padding: 5px;
        }
        #project-name { width: 300px; }

        /* 主容器 */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .resizer {
            flex-basis: 5px;
            background-color: #4a4f5a;
            cursor: col-resize;
            height: 100%;
            position: relative;
            z-index: 10;
        }
        .resizer:hover, .resizing { background-color: #528bff; }

        /* 编辑器区域 */
        #editor-container {
            flex-basis: 50%;
            height: 100%;
            overflow: auto;
            position: relative;
        }
        .cm-editor {
            height: 100%;
            font-size: 20px;
            font-family: Consolas, 'Courier New', monospace;
        }

        /* 输出区域 */
        .output-container {
            flex-basis: 50%;
            display: flex;
            flex-direction: column;
            background: #282c34;
            overflow: hidden;
        }
        .output-tabs {
            padding: 5px 10px;
            background: #3a3f4b;
        }
        .output-tabs button {
            padding: 8px 12px;
            border: none;
            background: none;
            color: #999;
            cursor: pointer;
        }
        .output-tabs button.active {
            color: white;
            border-bottom: 2px solid #528bff;
        }
        .output-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-family: monospace;
            white-space: pre-wrap;
            color: #abb2bf;
            font-size: 14px;
        }
        #library-viewer { padding: 10px; }
        #library-viewer select {
            width: 100%;
            padding: 5px;
            background: #3a3f4b;
            color: white;
            border: 1px solid #4a4f5a;
            border-radius: 4px;
        }
        #library-content-display {
            margin-top: 10px;
            background: #21252b;
            padding: 10px;
            border-radius: 4px;
            min-height: 200px;
        }
        #bytecode-view select {
            width: 100%;
            padding: 5px;
            background: #3a3f4b;
            color: white;
            border: 1px solid #4a4f5a;
            border-radius: 4px;
            margin-bottom: 10px;
            font-family: Consolas, 'Courier New', monospace;
        }
        #bytecode-content-display {
            margin-top: 10px;
            background: #21252b;
            padding: 10px;
            border-radius: 4px;
            min-height: 200px;
            white-space: pre;
            word-break: break-all;
            overflow-x: auto;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }
        #bytecode-view { display: block; }
        #library-viewer { display: none; }

        /* 教程模态框 */
        #tutorial-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            overflow-y: auto;
            padding: 20px;
        }
        #tutorial-content-wrapper {
            background: #282c34;
            color: #abb2bf;
            padding: 25px;
            border-radius: 8px;
            width: 90%;
            max-width: 900px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        #tutorial-content { color: #abb2bf; font-size: 16px; line-height: 1.6; }
        #tutorial-content h1, #tutorial-content h2, #tutorial-content h3 {
            color: #528bff;
            border-bottom: 1px solid #3a3f4b;
            padding-bottom: 5px;
            margin-top: 1.5em;
        }
        #tutorial-content a { color: #528bff; }
        #tutorial-content pre, #tutorial-content code {
            background-color: #21252b;
            color: #e6db74;
            padding: 2px 4px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-all;
        }
        #tutorial-content pre {
            display: block;
            padding: 10px;
            margin: 1em 0;
            overflow-x: auto;
        }
    </style>

  <script type="module" crossorigin src="./assets/index-BVf5MT18.js"></script>
</head>
<body>
    <div class="toolbar">
        <input type="file" id="file-importer" multiple style="display: none;">
        <button id="import-btn">导入自定义配置</button>
        <button id="compile-btn">准备启动……</button>
        <button id="export-source-btn">导出源代码</button>
        <button id="export-bytecode-btn">导出字节码</button>
        <!-- 新增复制字节码按钮 -->
        <button id="copy-bytecode-btn">复制字节码</button>
        <button id="force-update-btn">
            <span id="update-status">正在检查更新……</span>
        </button>
        <button id="show-tutorial-btn">语法教程</button>
        <span>项目名: <input type="text" id="project-name" value="ROP_Project"></span>
        <span>地址1: <input type="text" id="addr1" value="D710"></span>
        <span>地址2: <input type="text" id="addr2" value="E9E0"></span>
    </div>

    <div class="main-container">
        <div id="editor-container"></div>
        <div id="dragMe" class="resizer"></div>
        <div class="output-container">
            <div class="output-tabs">
                <button id="tab-bytecode-btn" class="active">字节码</button>
                <button id="tab-library-btn">库文件</button>
            </div>
            <div id="bytecode-view" class="output-content">
                <select id="bytecode-selector">
                    <option value="">-- 请先编译 --</option>
                </select>
                <pre id="bytecode-content-display">编译结果将显示在此处……</pre>
            </div>
            <div id="library-viewer" class="output-content">
                <select id="library-selector">
                    <option value="">-- 请先导入库文件 --</option>
                </select>
                <pre id="library-content-display"></pre>
            </div>
        </div>
    </div>

    <py-config>packages = ["lark"]</py-config>
    <py-script src="./compiler.py"></py-script>

    <div id="tutorial-modal">
        <div id="tutorial-content-wrapper">
            <h2>语法教程</h2>
            <div id="tutorial-content">正在加载教程……</div>
            <button id="close-modal-btn" class="toolbar-button">关闭</button>
        </div>
    </div>

    <script src="./vendor/marked/marked.min.js"></script>
</body>
</html>
